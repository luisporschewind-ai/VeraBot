# 备用方案：若 VeraBot.xcodeproj 无法打开，可 `brew install xcodegen && xcodegen generate` 重新生成
name: VeraBot
options:
  bundleIdPrefix: com.verabot
  deploymentTarget:
    iOS: "17.0"
packages:
  VeraBotKit:
    path: Packages/VeraBotKit   # 本地 Swift Package（SPM）
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  VeraBot:
    type: application
    platform: iOS
    sources: [VeraBot]
    dependencies:
      - package: VeraBotKit
        product: VeraBotCore
      - package: VeraBotKit
        product: VeraBotNetworking
      - package: VeraBotKit
        product: VeraBotPersistence
      - package: VeraBotKit
        product: VeraBotData
      - package: VeraBotKit
        product: VeraBotTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verabot.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Vera Bot"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2026101605
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4M4EACBGAJ
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  VeraBotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VeraBotTests]
    dependencies:
      - target: VeraBot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VeraBot:
    build:
      targets:
        VeraBot: all
    test:
      targets: [VeraBotTests]
