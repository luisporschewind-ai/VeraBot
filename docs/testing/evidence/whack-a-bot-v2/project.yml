name: WhackBotVisualChecks
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1'
targets:
  WhackBotVisualChecks:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.verabot.whackbot.visualchecks
schemes:
  WhackBotVisualChecks:
    build:
      targets:
        WhackBotVisualChecks: all
    test:
      targets: [WhackBotVisualChecks]
