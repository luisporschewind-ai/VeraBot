[project]
name = "verabot-backend"
version = "0.1.0"
description = "VeraBot 后端：私人 AI 助理团队（FastAPI + SQLite + DeepSeek，多 Agent 协作）"
readme = "README.md"
requires-python = ">=3.11"
# 直接依赖精确锁定（Pinned）；传递依赖由 uv.lock 锁定。修改后运行：uv lock && uv export ... > requirements.txt（见 README）
dependencies = [
    "fastapi==0.142.1",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# 可选：本地语音转写回退（OpenAI 不可用时使用；首次运行下载约 460 MB 的 small 模型到 data/models）
local-stt = ["faster-whisper>=1.0"]

[tool.uv]
package = false   # 应用而非库：不构建 wheel，直接以 `python -m uvicorn verabot.main:app` 运行
# 与 v0.1.0 验证环境完全一致的传递依赖版本
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "click==8.5.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.8.0",
    "idna==3.20",
    "opentelemetry-api==1.45.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "starlette==1.7.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvloop==0.22.1",
    "watchfiles==1.3.0",
    "websockets==17.1",
]
